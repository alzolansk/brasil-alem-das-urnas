# Tarefa 4.5: ruff + pytest a cada push e pull request (sem credencial GCP).
# Os testes de ingestão precisam dos zips do TSE em data/raw/ (fora do git) e são pulados aqui.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
