[project]
name = "brasil-alem-das-urnas"
version = "0.1.0"
description = "Participação eleitoral nos municípios brasileiros: 2022 × 2026"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
